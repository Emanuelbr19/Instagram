<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Instagram</title>
    <link rel="stylesheet" href="css/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<div class="container-fluid g-0">
    <div class="row g-0">
        <!-- Barra izquierda (Caja 0) -->
        <div class="caja1 col-md-2 col-lg-2 col-xl-2 col-xxl-2 d-none d-md-block ">0</div>

        <!-- Contenido central (Cajas 1 y 2) -->
        <div class="col-12 col-md-10 col-xl-8 g-0">
            <!-- Caja 00 (solo móvil) -->
            <div class="caja00 d-md-none">00</div>

            <!-- Caja 1 y 2 -->
            <div class="caja2">1</div>
            <div class="caja3">2</div>
            <div class="caja4">3</div>
        </div>

        <!-- Barra derecha (Caja 5)-->
        <div class="caja1 col-xl-2 col-xxl-2">5</div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>
</body>

</html>
